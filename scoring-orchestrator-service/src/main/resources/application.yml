server:
  port: 8082

spring:
  application:
    name: scoring-orchestrator-service

services:
  external-mock:
    url: http://localhost:8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}