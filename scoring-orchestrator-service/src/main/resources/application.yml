server:
  port: 8082

spring:
  application:
    name: scoring-orchestrator-service
  r2dbc:
    url:${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/credit_db}
    username: ${SPRING_R2DBC_USERNAME:kaspi_admin}
    password: ${SPRING_R2DBC_PASSWORD:kaspi_secret_password}

services:
  external-mock:
    url: http://localhost:8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}