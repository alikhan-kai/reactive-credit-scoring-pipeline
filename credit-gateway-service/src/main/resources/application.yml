server:
  port: 8080

spring:
  application:
    name: credit-gateway-service
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

security:
  rate-limit:
    max-requests-per-window: 30
    window-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
