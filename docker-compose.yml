version: '3.8'

services:
  # 1. Реляционная СУБД для договоров и графиков платежей (R2DBC)
  postgres:
    image: postgres:16-alpine
    container_name: kaspi-postgres
    environment:
      POSTGRES_DB: credit_db
      POSTGRES_USER: kaspi_admin
      POSTGRES_PASSWORD: kaspi_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaspi_admin -d credit_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - credit-network

  # 2. In-Memory хранилище: идемпотентность (дедупликация), кэш скоринга, Token Bucket
  redis:
    image: redis:7-alpine
    container_name: kaspi-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - credit-network

  # 3. Apache Kafka (KRaft режим без тяжелого Zookeeper)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kaspi-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - credit-network

  # 4. Веб-интерфейс для просмотра очередей и сообщений Kafka
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kaspi-kafka-ui
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kaspi-credit-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - credit-network

  # 5. Сервер распределенной трассировки (Zipkin)
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: kaspi-zipkin
    ports:
      - "9411:9411"
    networks:
      - credit-network

  # 6. Сбор метрик со Spring Boot Actuator (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: kaspi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - credit-network

  # 7. Дашборды мониторинга (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: kaspi-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - credit-network

networks:
  credit-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  grafana_data: