version: '3.8'

services:
  # ==========================================
  # ИНФРАСТРУКТУРА (БАЗЫ ДАННЫХ И БРОКЕРЫ)
  # ==========================================

  # 1. PostgreSQL для договоров и графиков платежей (R2DBC)
  postgres:
    image: postgres:16-alpine
    container_name: kaspi-postgres
    environment:
      POSTGRES_DB: credit_db
      POSTGRES_USER: kaspi_admin
      POSTGRES_PASSWORD: kaspi_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaspi_admin -d credit_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - credit-network

  # 2. In-Memory хранилище: идемпотентность (SETNX) и сессионный кэш
  redis:
    image: redis:7-alpine
    container_name: kaspi-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - credit-network

  # 3. Apache Kafka (KRaft режим)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kaspi-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - credit-network

  # 4. Веб-интерфейс Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kaspi-kafka-ui
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kaspi-credit-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - credit-network

  # 5. Сервер распределенной трассировки Zipkin
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: kaspi-zipkin
    ports:
      - "9411:9411"
    networks:
      - credit-network

  # 6. Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: kaspi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - credit-network

  # 7. Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: kaspi-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - credit-network

  # ==========================================
  # МИКРОСЕРВИСЫ ПЛАТФОРМЫ
  # ==========================================

  # 8. Эмулятор внешних систем (ПКБ, ГЦВП, АИС ОИП)
  external-mock-service:
    build:
      context: .
      dockerfile: external-mock-service/Dockerfile
      args:
        JAR_FILE: external-mock-service/build/libs/external-mock-service-0.0.1-SNAPSHOT.jar
    container_name: kaspi-external-mock
    ports:
      - "8083:8083"
    networks:
      - credit-network

  # 9. Реактивный оркестратор скоринга (DAG, Scatter-Gather)
  scoring-orchestrator-service:
    build:
      context: .
      dockerfile: scoring-orchestrator-service/Dockerfile
      args:
        JAR_FILE: scoring-orchestrator-service/build/libs/scoring-orchestrator-service-0.0.1-SNAPSHOT.jar
    container_name: kaspi-scoring-orchestrator
    ports:
      - "8082:8082"
    environment:
      SERVICES_EXTERNAL_MOCK_URL: http://external-mock-service:8083
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka
      - external-mock-service
    networks:
      - credit-network

  # 10. Входной шлюз приема заявок (Idempotency, Netty)
  credit-gateway-service:
    build:
      context: .
      dockerfile: credit-gateway-service/Dockerfile
      args:
        JAR_FILE: credit-gateway-service/build/libs/credit-gateway-service-0.0.1-SNAPSHOT.jar
    container_name: kaspi-credit-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVICES_SCORING_ORCHESTRATOR_URL: http://scoring-orchestrator-service:8082
    depends_on:
      - redis
      - scoring-orchestrator-service
    networks:
      - credit-network

  # 11. Договорной сервис (R2DBC PostgreSQL, Kafka Consumer)
  credit-agreement-service:
    build:
      context: .
      dockerfile: credit-agreement-service/Dockerfile
      args:
        JAR_FILE: credit-agreement-service/build/libs/credit-agreement-service-0.0.1-SNAPSHOT.jar
    container_name: kaspi-credit-agreement
    ports:
      - "8084:8084"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/credit_db
      SPRING_R2DBC_USERNAME: kaspi_admin
      SPRING_R2DBC_PASSWORD: kaspi_secret_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - postgres
      - kafka
    networks:
      - credit-network

  # 12. Сервис регуляторного аудита и нотификаций
  audit-notification-service:
    build:
      context: .
      dockerfile: audit-notification-service/Dockerfile
      args:
        JAR_FILE: audit-notification-service/build/libs/audit-notification-service-0.0.1-SNAPSHOT.jar
    container_name: kaspi-audit-notification
    ports:
      - "8085:8085"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - credit-network

networks:
  credit-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  grafana_data: