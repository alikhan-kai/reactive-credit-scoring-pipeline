server:
  port: 8083

spring:
  application:
    name: external-mock-service

mock:
  simulation:
    pkb-delay-ms: 300
    gcvp-delay-ms: 600
    ais-oip-delay-ms: 150
    timeout-delay-ms: 3000
    gcvp-failure-rate: 0.05

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
